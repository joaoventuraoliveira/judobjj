<style>
:root{

  --a:#2F64C8; --a-ink:#fff;

}
@media (prefers-color-scheme:dark){

}
:root[data-theme="dark"]{--bg:#10171D;--panel:#18222A;--ink:#E7EDF1;--muted:#98A8B4;--line:#2B3946;--soft:#1F2B34}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--a);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:100vh}
/* ---- rail ---- */
.rail{position:sticky;top:0;height:100vh;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:20px 16px 32px}
.brand{font:700 1.35rem/1.1 var(--display);letter-spacing:-.01em;margin:2px 4px 16px}
.brand small{display:block;font:400 .8rem/1.3 var(--body);color:var(--muted);margin-top:6px;letter-spacing:0}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--soft);padding:4px;border-radius:12px;margin-bottom:14px}
.mode button{border:0;background:transparent;padding:9px 8px;border-radius:9px;font:600 .95rem var(--display);cursor:pointer;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);margin-bottom:12px}
.ladder{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.ladder button{width:100%;display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;text-align:left;border:0;background:transparent;padding:8px 8px;border-radius:10px;cursor:pointer}
.ladder button:hover{background:var(--soft)}
.ladder button[aria-current="true"]{background:var(--soft);box-shadow:inset 3px 0 0 var(--a)}
.ladder .t{font:600 .95rem/1.2 var(--display)}
.ladder .s{display:block;font-size:.78rem;color:var(--muted)}
.ladder .p{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.group{font:700 .78rem var(--display);color:var(--muted);margin:14px 8px 4px}
/* ---- belt ---- */
.belt{position:relative;height:14px;border-radius:3px;background:var(--b1);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 38%,transparent);overflow:hidden}
.belt::after{content:"";position:absolute;right:0;top:0;bottom:0;width:26%;background:var(--b2,var(--b1))}
.belt.bar::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;background:var(--b2);opacity:.0}
.hero .belt{height:34px;border-radius:5px}
/* ---- main ---- */
main{padding:28px clamp(16px,4vw,44px) 64px;min-width:0}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,3vw,30px)}
.hero h1{font:700 clamp(1.8rem,4.2vw,3rem)/1.02 var(--display);letter-spacing:-.02em;margin:0 0 4px}
.hero .sub{color:var(--muted);margin:0 0 20px}
.belts{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin:6px 0 22px}
.belts .lbl{font-size:.8rem;color:var(--muted);margin-top:6px}
.arrow{font:700 1.4rem var(--display);color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0}
.facts div{background:var(--panel);padding:12px 14px}
.facts dt{font-size:.8rem;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:700}
.note{margin:16px 0 0;padding:12px 14px;border-left:4px solid var(--a);background:var(--soft);border-radius:0 10px 10px 0;font-size:.95rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 14px}
.tabs button{border:1px solid var(--line);background:var(--panel);padding:9px 14px;border-radius:999px;font:600 .92rem var(--display);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--a);color:var(--a-ink);border-color:var(--a)}
/* ---- sections ---- */
.sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:0 0 12px;overflow:hidden}
.sec>header{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:14px 18px;border-bottom:1px solid var(--line)}
.sec h2{font:700 1.15rem/1.2 var(--display);margin:0}

.item{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,260px);gap:6px 14px;padding:14px 18px;border-top:1px solid var(--line);align-items:start}
.item:first-of-type{border-top:0}
.item input{margin-top:5px;width:18px;height:18px;accent-color:var(--a)}

.thumbs{display:grid;gap:6px}
.thumbs button{border:1px solid var(--line);background:#fff;padding:0;border-radius:8px;overflow:hidden;cursor:zoom-in;display:block;position:relative}
.thumbs img{display:block;width:100%;height:auto}

.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;padding:0 18px 18px}

.gal img{display:block;width:100%}
.prose{padding:14px 18px 18px}
.prose dl{display:grid;grid-template-columns:minmax(120px,220px) 1fr;gap:10px 18px;margin:0}
.prose dt{font-weight:700}
.prose dd{margin:0}
.ficha{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:20px;padding:14px 18px 18px}
.ficha img{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:zoom-in}
.empty{padding:28px;text-align:center;color:var(--muted)}
.src{font-size:.85rem;color:var(--muted);margin-top:22px}
.src a{color:inherit}
dialog{border:0;border-radius:14px;padding:0;max-width:min(1100px,96vw);background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(10,16,22,.7)}
dialog img{display:block;max-width:100%;max-height:82vh;margin:auto;background:#fff}
dialog form{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;font-size:.9rem}
dialog button{border:1px solid var(--line);background:var(--soft);padding:6px 14px;border-radius:8px;cursor:pointer}
.theme{position:fixed;right:14px;bottom:14px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;cursor:pointer;z-index:5}
@media (max-width:980px){html:not(.lay-desktop) .app{grid-template-columns:1fr}html:not(.lay-desktop) .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}html:not(.lay-desktop) .ladder{grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);overflow-x:auto;padding-bottom:8px}html:not(.lay-desktop) .item{grid-template-columns:auto minmax(0,1fr)}html:not(.lay-desktop) .thumbs{grid-column:2}html:not(.lay-desktop) .ficha{grid-template-columns:1fr}html:not(.lay-desktop) .belts{grid-template-columns:1fr}html:not(.lay-desktop) .arrow{display:none}}html.lay-mobile .app{grid-template-columns:1fr}html.lay-mobile .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}html.lay-mobile .ladder{grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);overflow-x:auto;padding-bottom:8px}html.lay-mobile .item{grid-template-columns:auto minmax(0,1fr)}html.lay-mobile .thumbs{grid-column:2}html.lay-mobile .ficha{grid-template-columns:1fr}html.lay-mobile .belts{grid-template-columns:1fr}html.lay-mobile .arrow{display:none}
@media (prefers-reduced-motion:no-preference){
  .hero .belt{transition:background .35s}

}

<style>
.fx{--fxc:#2468B3;margin:0 0 6px}

.fx-bar button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 12px;font:600 .88rem var(--display);cursor:pointer;min-height:40px}

<script>
window.FichaForm=(function(){
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const ctx={};
  const K=id=>"ficha:"+id;
  const load=id=>{try{return JSON.parse(localStorage.getItem(K(id))||"null")}catch(e){return null}};
  const save=(id,s)=>{try{localStorage.setItem(K(id),JSON.stringify(s))}catch(e){}};
  function state(t,F){
    let s=load(t.id);
    if(!s||!s.rows){ s={cand:"",exam:"",data:"",rows:F.tabelas.map(tb=>Array.from({length:tb.linhas},()=>({n:"",v:""})))}; }
    F.tabelas.forEach((tb,i)=>{ if(!s.rows[i]) s.rows[i]=Array.from({length:tb.linhas},()=>({n:"",v:""})); });
    return s;
  }
  function tabela(F,tb,i,s,tid){
    const rows=s.rows[i];
    return `<div class="fx-tab" data-ti="${i}"><div class="fx-h"><span>${esc(tb.nome)}</span><span>YES</span><span>NO</span></div>${rows.map((r,j)=>`<div class="fx-r ${j>=tb.pontilhadas?"solid":""}" data-ri="${j}"><input class="fx-n" list="fx-dl-${tid}-${i}" value="${esc(r.n)}" aria-label="${esc(tb.nome)}, linha ${j+1}: técnica"><button class="fx-b y" aria-pressed="${r.v==="y"}" aria-label="Sim, linha ${j+1}">${r.v==="y"?"✓":""}</button><button class="fx-b n" aria-pressed="${r.v==="n"}" aria-label="Não, linha ${j+1}">${r.v==="n"?"✗":""}</button></div>`).join("")}<button class="fx-add" data-add="${i}">+ adicionar linha</button><datalist id="fx-dl-${tid}-${i}">${(tb.opcoes||[]).map(o=>`<option value="${esc(o)}">`).join("")}</datalist></div>`;
  }
  function summary(s){
    let y=0,n=0,f=0,tot=0;
    s.rows.forEach(rs=>rs.forEach(r=>{ if(r.n.trim()||r.v){ f++; } if(r.v==="y")y++; if(r.v==="n")n++; tot++; }));
    const a=y+n, pct=a?Math.round(y*100/a):0;
    return `<span>Linhas preenchidas: <b>${f}</b> de ${tot}</span><span>SIM: <b>${y}</b></span><span>NÃO: <b>${n}</b></span><span>Aproveitamento nas linhas avaliadas: <b>${a?pct+"%":"—"}</b></span><span class="nt">Resumo para simulação de estudo. A JJIF não define nota de corte na ficha; a aprovação é decisão do examinador.</span>`;
  }
  function html(t,A,prog){
    const F=A.form; if(!F) return "";
    ctx[t.id]={t,A,F,prog};
    const s=state(t,F); save(t.id,s);
    const pm={}; (prog&&prog.secoes||[]).forEach(x=>{pm[x.cat]=x.itens.map(i=>i.t)});
    F.tabelas.forEach(tb=>{ tb.opcoes=[].concat(...tb.fonte.map(c=>pm[c]||[])); });
    const col=side=>F.tabelas.map((tb,i)=>[tb,i]).filter(([tb])=>tb.col===side).map(([tb,i])=>tabela(F,tb,i,s,t.id)).join("");
    return `<div class="fx-tit">Simulador: preencha a ficha de exame</div><p class="fx-hint">Mesmo modelo da ficha da JJIF, editável. Escreva ou escolha a técnica em cada linha e marque SIM ou NÃO. Use “Sortear do programa” para simular o examinador pedindo técnicas da lista da faixa. Tudo fica salvo neste navegador.</p>
    <section class="fx" data-fx="${t.id}" style="--fxc:${F.cor}">
      <div class="fx-bar"><label>Candidato<input data-f="cand" value="${esc(s.cand)}"></label><label>Examinador<input data-f="exam" value="${esc(s.exam)}"></label><label>Data<input data-f="data" type="date" value="${esc(s.data)}"></label>
        <button class="pri" data-fa="draw">Sortear do programa</button><button data-fa="clear">Limpar ficha</button><button data-fa="print">Imprimir / PDF</button><button data-fa="copy">Copiar resumo</button></div>
      <div class="fx-sheet"><div class="fx-ban">${esc(F.titulo)}</div>
        <div class="fx-print-info" style="padding:6px 18px 0;font-size:.8rem;color:#333" data-info>${esc(s.cand?"Candidato: "+s.cand:"")} ${esc(s.exam?" · Examinador: "+s.exam:"")} ${esc(s.data?" · Data: "+s.data:"")}</div>
        <div class="fx-box"><div><h4>Evaluation Criteria</h4><ul>${F.criterios.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></div><div><h4>Additional Options</h4><ul>${F.opcoes.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></div></div>
        <div class="fx-cols"><div class="fx-col">${col("L")}</div><div class="fx-col">${col("R")}</div></div></div>
      <div class="fx-sum" data-sum>${summary(s)}</div>
    </section>`;
  }
  function rerender(root){ const id=root.dataset.fx,c=ctx[id]; const tmp=document.createElement("div"); tmp.innerHTML=html(c.t,c.A,c.prog); const nw=tmp.querySelector("[data-fx]"); root.replaceWith(nw); }
  function draw(id){
    const c=ctx[id],s=state(c.t,c.F||c.A.form),F=c.A.form,pm={};
    (c.prog&&c.prog.secoes||[]).forEach(x=>{pm[x.cat]=x.itens.map(i=>i.t)});
    const used={};
    F.tabelas.forEach((tb,i)=>{
      const pool=[].concat(...tb.fonte.map(cat=>pm[cat]||[])).filter(x=>!used[x]);
      for(let k=pool.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[pool[k],pool[j]]=[pool[j],pool[k]]}
      s.rows[i].forEach((r,j)=>{ const pick=pool[j]; if(pick){ r.n=pick; used[pick]=1; } });
    });
    save(id,s);
  }
  document.addEventListener("click",e=>{
    const root=e.target.closest("[data-fx]"); if(!root) return; const id=root.dataset.fx;
    const b=e.target.closest(".fx-b"); if(b){ const s=state(ctx[id].t,ctx[id].A.form); const ti=+b.closest(".fx-tab").dataset.ti,ri=+b.closest(".fx-r").dataset.ri; const want=b.classList.contains("y")?"y":"n"; const r=s.rows[ti][ri]; r.v=r.v===want?"":want; save(id,s); b.closest(".fx-r").querySelectorAll(".fx-b").forEach(x=>{const yy=x.classList.contains("y"); const on=r.v===(yy?"y":"n"); x.setAttribute("aria-pressed",on); x.textContent=on?(yy?"✓":"✗"):""}); root.querySelector("[data-sum]").innerHTML=summary(s); return; }
    const ad=e.target.closest("[data-add]"); if(ad){ const s=state(ctx[id].t,ctx[id].A.form); s.rows[+ad.dataset.add].push({n:"",v:""}); save(id,s); rerender(root); return; }
    const ac=e.target.closest("[data-fa]"); if(!ac) return; const a=ac.dataset.fa;
    if(a==="draw"){ draw(id); rerender(root); }
    else if(a==="clear"){ if(confirm("Limpar toda a ficha desta faixa?")){ try{localStorage.removeItem(K(id))}catch(x){} rerender(root); } }
    else if(a==="print"){ window.print(); }
    else if(a==="copy"){ const s=state(ctx[id].t,ctx[id].A.form),F=ctx[id].A.form; let out=F.titulo+"\n"+(s.cand?"Candidato: "+s.cand+"\n":"")+(s.exam?"Examinador: "+s.exam+"\n":"")+(s.data?"Data: "+s.data+"\n":""); F.tabelas.forEach((tb,i)=>{ const rs=s.rows[i].filter(r=>r.n.trim()||r.v); if(rs.length) out+="\n"+tb.nome+"\n"+rs.map(r=>"- "+(r.n||"(sem nome)")+" ["+(r.v==="y"?"SIM":r.v==="n"?"NÃO":"—")+"]").join("\n")+"\n"; }); try{navigator.clipboard.writeText(out); ac.textContent="Copiado ✓"; setTimeout(()=>ac.textContent="Copiar resumo",1500)}catch(x){ prompt("Copie o resumo:",out) } }
  });
  document.addEventListener("input",e=>{
    const root=e.target.closest("[data-fx]"); if(!root) return; const id=root.dataset.fx; const s=state(ctx[id].t,ctx[id].A.form);
    if(e.target.dataset.f){ s[e.target.dataset.f]=e.target.value; const inf=root.querySelector("[data-info]"); inf.textContent=[s.cand&&"Candidato: "+s.cand,s.exam&&"Examinador: "+s.exam,s.data&&"Data: "+s.data].filter(Boolean).join(" · "); save(id,s); return; }
    if(e.target.classList.contains("fx-n")){ const ti=+e.target.closest(".fx-tab").dataset.ti,ri=+e.target.closest(".fx-r").dataset.ri; s.rows[ti][ri].n=e.target.value; save(id,s); root.querySelector("[data-sum]").innerHTML=summary(s); }
  });
  return {html};
})();
</script>
<script>
function boot(){
const D = window.DATA; const $ = s=>document.querySelector(s);

function trs0(k){ if(!k) return null; const r=DICT[k]; if(r!==undefined) return r; for(const [rx,t] of RULES){ if(rx.test(k)) return k.replace(rx,t) } return null }
function trs(s){ if(s==null||s==="") return s; s=String(s); const m=s.match(/^(\s*)([\s\S]*?)(\s*)$/); const k=m[2].replace(/\s+/g," "); if(!k) return s;

const TRATTR=["placeholder","aria-label","alt","title","data-cap"];

{ let pend=false; const OPT={childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:TRATTR};

function inkFor(h){const n=parseInt(h.slice(1),16),c=[n>>16,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});const L=.2126*c[0]+.7152*c[1]+.0722*c[2];return (1.05/(L+.05))>=((L+.05)/.0584)?"#fff":"#10171D"}
function accent(t){const c=(t.bpara||t.bde); let a=c[1]||c[0]; if(/^#F5/i.test(a)||/^#9A/i.test(a)||/^#F2C/i.test(a)||/^#EE8/i.test(a)) a=c[0]; if(/^#F5/i.test(a)||/^#9A/i.test(a)) a="#4A5C6B"; return a}

function renderLadder(){

function refsHtml(obj,extra){
  const ids=new Set(extra||[]); (function walk(o){ if(!o||typeof o!=="object") return; if(Array.isArray(o.refs)) o.refs.forEach(r=>ids.add(r)); for(const k in o) walk(o[k]); })(obj);

  }
  if(A.tipo==="ficha"){
    return `<section class="sec"><header><h2>Ficha de exame da JJIF</h2></header><div class="ficha"><div class="prose"><dl><dt>Critérios de avaliação</dt><dd>${esc(A.criterios)}</dd><dt>Opções do examinador</dt><dd>${esc(A.opcoes)}</dd><dt>Seções da ficha</dt><dd>${esc(A.secoes_ficha)}</dd><dt>Carga mínima sugerida</dt><dd>${esc(A.carga)}</dd></dl></div><button style="border:0;background:none;padding:0" data-img="${A.img}" data-cap="Ficha de exame JJIF"><img src="${thumbUrl(A.img)}" alt="Ficha de exame da JJIF"></button></div><p class="cnote">Imagem: ficha de exame, JJIF Graduation System (v11), seção Belt Exam.</p></section>`+FichaForm.html(t,A,t.abas.find(a=>a.tipo==="jjif"));
  }
  return `<section class="sec"><header><h2>Regras da IBJJF/CBJJ</h2></header><div class="prose"><dl><dt>Observações</dt><dd>${esc(A.extra)}</dd></dl></div><div class="gal">${A.imgs.map(im=>`<button data-img="${im}" data-cap="IBJJF — Sistema Geral de Graduação (jun/2026)"><img loading="lazy" decoding="async" src="${thumbUrl(im)}" alt="Página do sistema de graduação IBJJF"></button>`).join("")}</div></section>`;
}

  const s2 = e.target.closest("[data-sub2]"); if(s2){ sub2=+s2.dataset.sub2; renderMain(); return }
  const sb = e.target.closest("[data-sub]"); if(sb){ sub=+sb.dataset.sub; sub2=0; renderMain(); return }
  const tb = e.target.closest("[data-tab]"); if(tb){ tab=+tb.dataset.tab; sub=0; sub2=0; renderMain(); return }
  const ac = e.target.closest("[data-act]"); if(ac){ document.querySelectorAll(".sec").forEach(x=>x.classList.toggle("closed",ac.dataset.act==="collapse")); return }
  const go = e.target.closest("[data-go]"); if(go && go.dataset.go){ select(go.dataset.go); window.scrollTo({top:0}); return }
  const hd = e.target.closest(".sec>header"); if(hd){ hd.parentElement.classList.toggle("closed"); return }
  const jl = e.target.closest(".jump a"); if(jl){ const el=document.querySelector(jl.getAttribute("href")); if(el){ e.preventDefault(); el.classList.remove("closed"); el.scrollIntoView({behavior:"smooth",block:"start"}); } return }
});
document.addEventListener("change",e=>{
  const c = e.target.closest("input[data-k]"); if(!c) return; if(c.checked) done[c.dataset.k]=1; else delete done[c.dataset.k]; store.set("done",done);
  const el = c.closest(".item,.chip"); if(el) el.classList.toggle("done",c.checked); renderLadder();
  const ks=allKeys(cur), d=ks.filter(k=>done[k]).length, pct=ks.length?Math.round(d*100/ks.length):0;
  const mt=document.querySelector(".mtxt"); if(mt) mt.textContent=d+" de "+ks.length+" estudados"; const ms=document.querySelector(".meter span"); if(ms) ms.style.width=pct+"%";

$("#dlg").addEventListener("click",e=>{ if(e.target.id==="dlg") e.target.close() });
function fromHash(){ const m=(location.hash||"").match(/^#(judo|bjj)\/(\w+)/); return m?{mode:m[1],id:m[2]}:null }
document.addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea,select")||$("#dlg").open||e.altKey||e.ctrlKey||e.metaKey) return;
  const L=D[mode].trans, i=L.findIndex(x=>x.id===cur.id);

});

$("#m-judo").onclick=()=>setMode("judo"); $("#m-bjj").onclick=()=>setMode("bjj");
$("#q").addEventListener("input",e=>{ query=e.target.value; renderLadder(); renderMain(); });
$("#theme").onclick=()=>JTPrefs.cycleTheme();

(function load(n){
  if(window.DATA) return boot();
  const s=document.createElement("script"); s.src="data.js"+(n?"?r="+n:"");
  s.onload=boot;
  s.onerror=()=>{ if(n<4) setTimeout(()=>load(n+1),500); else document.getElementById("main").innerHTML='<p class="empty">Não foi possível carregar data.js. Use o arquivo único JudoBJJApp_celular.html (não depende de outros arquivos) ou mantenha data.js e a pasta img ao lado de index.html.</p>'; };
  document.head.appendChild(s);
})(0);

<script>
(function(){var ul=document.getElementById('ladder'),p=document.querySelector('.rnav.prev'),n=document.querySelector('.rnav.next');if(!ul||!p||!n)return;
function upd(){var max=ul.scrollWidth-ul.clientWidth-2;p.hidden=ul.scrollLeft<=2;n.hidden=ul.scrollLeft>=max||max<=0}
function go(d){ul.scrollBy({left:d*Math.max(240,ul.clientWidth*.8),behavior:'smooth'})}
p.addEventListener('click',function(){go(-1)});n.addEventListener('click',function(){go(1)});
ul.addEventListener('scroll',upd,{passive:true});addEventListener('resize',upd);
new MutationObserver(function(){var c=ul.querySelector('[aria-current="true"]');if(c){var a=c.getBoundingClientRect(),b=ul.getBoundingClientRect();if(a.left<b.left+8||a.right>b.right-8)ul.scrollLeft+=(a.left-b.left)-(b.width-a.width)/2}upd()}).observe(ul,{childList:true,subtree:true,attributes:true,attributeFilter:['aria-current']});
setTimeout(upd,300);})();
</script>
