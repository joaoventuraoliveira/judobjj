<style>
:root{
  --bg:#E8ECEF; --panel:#FBFCFC; --ink:#18232D; --muted:#566673; --line:#CBD5DB; --soft:#F1F4F6;
  --a:#2F64C8; --a-ink:#fff;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#10171D;--panel:#18222A;--ink:#E7EDF1;--muted:#98A8B4;--line:#2B3946;--soft:#1F2B34}
}
:root[data-theme="dark"]{--bg:#10171D;--panel:#18222A;--ink:#E7EDF1;--muted:#98A8B4;--line:#2B3946;--soft:#1F2B34}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--a);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:100vh}
/* ---- rail ---- */
.rail{position:sticky;top:0;height:100vh;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:20px 16px 32px}
.brand{font:700 1.35rem/1.1 var(--display);letter-spacing:-.01em;margin:2px 4px 16px}
.brand small{display:block;font:400 .8rem/1.3 var(--body);color:var(--muted);margin-top:6px;letter-spacing:0}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--soft);padding:4px;border-radius:12px;margin-bottom:14px}
.mode button{border:0;background:transparent;padding:9px 8px;border-radius:9px;font:600 .95rem var(--display);cursor:pointer;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);margin-bottom:12px}
.ladder{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.ladder button{width:100%;display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;text-align:left;border:0;background:transparent;padding:8px 8px;border-radius:10px;cursor:pointer}
.ladder button:hover{background:var(--soft)}
.ladder button[aria-current="true"]{background:var(--soft);box-shadow:inset 3px 0 0 var(--a)}
.ladder .t{font:600 .95rem/1.2 var(--display)}
.ladder .s{display:block;font-size:.78rem;color:var(--muted)}
.ladder .p{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.group{font:700 .78rem var(--display);color:var(--muted);margin:14px 8px 4px}
/* ---- belt ---- */
.belt{position:relative;height:14px;border-radius:3px;background:var(--b1);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 38%,transparent);overflow:hidden}
.belt::after{content:"";position:absolute;right:0;top:0;bottom:0;width:26%;background:var(--b2,var(--b1))}
.belt.bar::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;background:var(--b2);opacity:.0}
.hero .belt{height:34px;border-radius:5px}
/* ---- main ---- */
main{padding:28px clamp(16px,4vw,44px) 64px;min-width:0}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,3vw,30px)}
.hero h1{font:700 clamp(1.8rem,4.2vw,3rem)/1.02 var(--display);letter-spacing:-.02em;margin:0 0 4px}
.hero .sub{color:var(--muted);margin:0 0 20px}
.belts{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin:6px 0 22px}
.belts .lbl{font-size:.8rem;color:var(--muted);margin-top:6px}
.arrow{font:700 1.4rem var(--display);color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0}
.facts div{background:var(--panel);padding:12px 14px}
.facts dt{font-size:.8rem;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:700}
.note{margin:16px 0 0;padding:12px 14px;border-left:4px solid var(--a);background:var(--soft);border-radius:0 10px 10px 0;font-size:.95rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 14px}
.tabs button{border:1px solid var(--line);background:var(--panel);padding:9px 14px;border-radius:999px;font:600 .92rem var(--display);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--a);color:var(--a-ink);border-color:var(--a)}
/* ---- sections ---- */
.sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:0 0 12px;overflow:hidden}
.sec>header{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:14px 18px;border-bottom:1px solid var(--line)}
.sec h2{font:700 1.15rem/1.2 var(--display);margin:0}
.sec .n{font-size:.8rem;color:var(--muted)}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,260px);gap:6px 14px;padding:14px 18px;border-top:1px solid var(--line);align-items:start}
.item:first-of-type{border-top:0}
.item input{margin-top:5px;width:18px;height:18px;accent-color:var(--a)}
.item p{margin:0;max-width:68ch}
.item.done p{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.thumbs{display:grid;gap:6px}
.thumbs button{border:1px solid var(--line);background:#fff;padding:0;border-radius:8px;overflow:hidden;cursor:zoom-in;display:block;position:relative}
.thumbs img{display:block;width:100%;height:auto}
.thumbs .pg{position:absolute;right:6px;top:6px;background:rgba(24,35,45,.85);color:#fff;font-size:.72rem;padding:1px 7px;border-radius:99px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:14px 18px}
.chip{display:flex;gap:8px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:6px 10px 6px 8px;font-size:.93rem}
.chip.done{opacity:.55;text-decoration:line-through}
.chip input{accent-color:var(--a)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;padding:0 18px 18px}
.gal button{border:1px solid var(--line);border-radius:10px;background:#fff;padding:0;overflow:hidden;cursor:zoom-in}
.gal img{display:block;width:100%}
.prose{padding:14px 18px 18px}
.prose dl{display:grid;grid-template-columns:minmax(120px,220px) 1fr;gap:10px 18px;margin:0}
.prose dt{font-weight:700}
.prose dd{margin:0}
.ficha{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:20px;padding:14px 18px 18px}
.ficha img{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:zoom-in}
.empty{padding:28px;text-align:center;color:var(--muted)}
.src{font-size:.85rem;color:var(--muted);margin-top:22px}
.src a{color:inherit}
dialog{border:0;border-radius:14px;padding:0;max-width:min(1100px,96vw);background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(10,16,22,.7)}
dialog img{display:block;max-width:100%;max-height:82vh;margin:auto;background:#fff}
dialog form{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;font-size:.9rem}
dialog button{border:1px solid var(--line);background:var(--soft);padding:6px 14px;border-radius:8px;cursor:pointer}
.theme{position:fixed;right:14px;bottom:14px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;cursor:pointer;z-index:5}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .ladder{grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);overflow-x:auto;padding-bottom:8px}
  .item{grid-template-columns:auto minmax(0,1fr)}
  .thumbs{grid-column:2}
  .ficha{grid-template-columns:1fr}
  .belts{grid-template-columns:1fr}.arrow{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .hero .belt{transition:background .35s}
  .sec{animation:none}
}

.stick{position:sticky;top:0;z-index:4;background:var(--bg);padding:10px 0 6px;margin:14px 0 6px}
.stick .tabs{margin:0 0 10px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.meter{flex:1 1 180px;max-width:320px;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--a);border-radius:99px;transition:width .25s}
.mtxt{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.sp{flex:1}
.bar button,.pager button{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:8px;font-size:.85rem;cursor:pointer}
.bar button:hover,.pager button:hover{background:var(--soft)}
.jump{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.jump a{flex:none;font-size:.82rem;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-decoration:none;white-space:nowrap}
.jump a:hover{border-color:var(--a)}
.sec{scroll-margin-top:120px}
.sec>header{cursor:pointer;user-select:none}
.sec>header h2::before{content:"";display:inline-block;width:.55em;height:.55em;margin-right:.6em;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px);transition:transform .15s}
.sec.closed>header h2::before{transform:rotate(-45deg)}
.sec.closed>*:not(header){display:none}
.sec.closed>header{border-bottom:0}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.pager button{padding:10px 16px;font:600 .95rem var(--display)}
.hero .belts>div:first-child .belt{opacity:.9}
@media print{
  .rail,.theme,.stick,.pager,dialog{display:none!important}
  .app{display:block}body{background:#fff;color:#000}
  .sec,.hero{break-inside:avoid;border-color:#999}.sec.closed>*:not(header){display:block!important}
}

.gl{margin:4px 18px 8px;font-size:.82rem;color:var(--muted)}
.ilus{border-top:1px dashed var(--line);margin-top:4px;padding-top:12px}
.ilus .gl{margin-top:0}
.gal.fig{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.gal figure{margin:0;display:grid;gap:6px;align-content:start}
.gal figure button{width:100%}
.gal figcaption{font-size:.82rem;color:var(--muted);line-height:1.35}
.gal figcaption b{color:var(--ink);display:block;font-weight:700}
.aviso{margin:0 18px 14px;font-size:.85rem;color:var(--muted)}

.sub{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.sub button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;font:600 .86rem var(--display);cursor:pointer;min-height:40px}
.sub button span{font-weight:400;color:var(--muted);margin-left:4px;font-size:.78rem}
.sub button[aria-selected="true"]{border-color:var(--a);box-shadow:inset 0 0 0 1px var(--a);background:var(--soft)}
.comp-list{display:grid;gap:1px;background:var(--line);margin:8px 0 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.comp-it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;background:var(--panel);padding:10px 16px;align-items:center}
.comp-n{font-weight:700}
.comp-c{grid-column:1;font-size:.78rem;color:var(--muted)}
.comp-v{grid-column:2;grid-row:1/3;font-size:.82rem;border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--ink);text-decoration:none;white-space:nowrap}
.comp-v:hover{border-color:var(--a)}
details.rule{margin:6px 16px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}
details.rule>summary{cursor:pointer;padding:10px 12px;font-weight:700;min-height:44px;display:flex;align-items:center}
details.rule h4{margin:8px 12px 2px;font-size:.88rem}
details.rule p{margin:0 12px 10px;font-size:.88rem;line-height:1.5}
.vlinks{display:flex;gap:8px;flex-wrap:wrap;margin:0 16px 14px}
.vlinks a{border:1px solid var(--a);color:var(--ink);border-radius:10px;padding:9px 12px;text-decoration:none;font-weight:700;font-size:.88rem}
.cnote{margin:0 16px 14px;font-size:.8rem;color:var(--muted)}

.sub2{margin-top:-4px}
.sub2 button{font-size:.8rem;padding:6px 10px;min-height:36px;background:var(--soft)}
.blk{padding:6px 16px 14px;border-top:1px solid var(--line)}
.blk h3{font:700 .98rem/1.25 var(--display);margin:12px 0 6px}
.blk p{margin:0 0 8px;white-space:pre-line;font-size:.92rem;line-height:1.5}
.blk .fig,.blk .gal{padding:0}
.vlist{display:grid;gap:8px;margin:4px 16px 14px}
.vcard{display:grid;gap:2px;border:1px solid var(--a);border-radius:10px;padding:10px 12px;text-decoration:none;color:var(--ink)}
.vcard:hover{background:var(--soft)}
.vcard .vt{font-weight:700;font-size:.92rem}
.vcard .vs{font-size:.76rem;color:var(--muted)}

.nmb{display:grid;gap:1px;min-width:0}
.nmb .nj{font-weight:700;font-size:.92rem}
.nmb .ne{font-weight:700}
.nmb .np{color:var(--ink);font-size:.88rem}
.nmb .nope{color:var(--muted);font-size:.78rem;font-style:italic}
.nmb .ns{color:var(--muted);font-size:.7rem}
.nmh{margin:10px 16px 0;display:grid;gap:1px;font-size:.88rem}
.nmh .nj{font-weight:700}
.nmh .ns{color:var(--muted);font-size:.72rem}
.cn{display:grid;gap:0;line-height:1.25}
.cn small{color:var(--muted);font-size:.74rem}
.termos{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.termos .tm{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:.78rem;line-height:1.3}
.termos .tm .j{font-weight:700}
.catnm{padding:0 16px 8px;display:grid;gap:1px;font-size:.82rem;color:var(--muted)}
.catnm .j{color:var(--ink);font-weight:700}
.refs{margin:22px 0 0;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.refs h3{font:700 1rem var(--display);margin:0 0 8px}
.refs ol{margin:0;padding-left:20px;font-size:.86rem;line-height:1.45}
.refs li{margin:0 0 6px}
.refs .rm{color:var(--muted)}
.refs a{color:var(--ink)}
.fig figcaption.cap2,.gal figcaption.cap2{font-size:.78rem;color:var(--muted);margin-top:4px}

.refs li,.refs .rm{overflow-wrap:anywhere;word-break:break-word}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--panel);padding:10px 14px;z-index:99;border-radius:0 0 8px 0}
.skip:focus{left:0}

@media (max-width:980px){.fx-r{min-height:44px}.fx-b{min-height:44px}}
.item input,.chip input,.tc input,.ck input{width:24px;height:24px}
.jgal{margin:18px 0}.jgal h2{font-size:1.1rem}.jgal .jgc{font-size:.82rem;color:var(--muted)}.jgal h3{margin:14px 0 6px;font-size:.95rem}.jgg{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}.jgt{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden;display:flex;flex-direction:column}.jgt button{border:0;padding:0;background:#fff;cursor:zoom-in}.jgt img{display:block;width:100%;height:120px;object-fit:contain}.jgt .jgn{padding:6px 8px;font-size:.78rem;line-height:1.3}.jgt .jgn b{display:block}.jgt .jgn a{display:inline-block;min-height:32px;padding:6px 0 0;color:var(--ink);font-weight:600}.jgbja{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}</style>
</head>

<div class="app">

<dialog id="dlg"><img id="dimg" alt=""><form method="dialog"><span id="dcap"></span><button>Fechar</button></form></dialog>
<script>

  const go = e.target.closest("[data-go]"); if(go && go.dataset.go){ select(go.dataset.go); window.scrollTo({top:0}); return }
  const hd = e.target.closest(".sec>header"); if(hd){ hd.parentElement.classList.toggle("closed"); return }
  const jl = e.target.closest(".jump a"); if(jl){ const el=document.querySelector(jl.getAttribute("href")); if(el){ e.preventDefault(); el.classList.remove("closed"); el.scrollIntoView({behavior:"smooth",block:"start"}); } return }
});
document.addEventListener("change",e=>{
  const c = e.target.closest("input[data-k]"); if(!c) return; if(c.checked) done[c.dataset.k]=1; else delete done[c.dataset.k]; store.set("done",done);
  const el = c.closest(".item,.chip"); if(el) el.classList.toggle("done",c.checked); renderLadder();
  const ks=allKeys(cur), d=ks.filter(k=>done[k]).length, pct=ks.length?Math.round(d*100/ks.length):0;
  const mt=document.querySelector(".mtxt"); if(mt) mt.textContent=d+" de "+ks.length+" estudados"; const ms=document.querySelector(".meter span"); if(ms) ms.style.width=pct+"%";
});
$("#dlg").addEventListener("click",e=>{ if(e.target.id==="dlg") e.target.close() });
function fromHash(){ const m=(location.hash||"").match(/^#(judo|bjj)\/(\w+)/); return m?{mode:m[1],id:m[2]}:null }
document.addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea,select")||$("#dlg").open||e.altKey||e.ctrlKey||e.metaKey) return;
  const L=D[mode].trans, i=L.findIndex(x=>x.id===cur.id);
  if(e.key==="ArrowRight"&&L[i+1]){ select(L[i+1].id); window.scrollTo({top:0}) }
  if(e.key==="ArrowLeft"&&L[i-1]){ select(L[i-1].id); window.scrollTo({top:0}) }
});
function setMode(m){ mode=m; $("#m-judo").setAttribute("aria-pressed",m==="judo"); $("#m-bjj").setAttribute("aria-pressed",m==="bjj"); query=""; $("#q").value=""; const hh=fromHash(); const last=(hh&&hh.mode===m)?hh.id:store.get("last:"+m); cur=null; select((D[m].trans.find(t=>t.id===last)||D[m].trans[0]).id); }
$("#m-judo").onclick=()=>setMode("judo"); $("#m-bjj").onclick=()=>setMode("bjj");
$("#q").addEventListener("input",e=>{ query=e.target.value; renderLadder(); renderMain(); });
$("#theme").onclick=()=>{ const r=document.documentElement; const dark = r.dataset.theme? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark?"light":"dark"; store.set("theme",r.dataset.theme) };
const th = store.get("theme"); if(th) document.documentElement.dataset.theme = th;
{ const hh=fromHash(); setMode(hh?hh.mode:"judo"); }
}
(function load(n){
  if(window.DATA) return boot();
  const s=document.createElement("script"); s.src="data.js"+(n?"?r="+n:"");
  s.onload=boot;
  s.onerror=()=>{ if(n<4) setTimeout(()=>load(n+1),500); else document.getElementById("main").innerHTML='<p class="empty">Não foi possível carregar data.js. Use o arquivo único JudoBJJApp_celular.html (não depende de outros arquivos) ou mantenha data.js e a pasta img ao lado de index.html.</p>'; };
  document.head.appendChild(s);
})(0);
</script>
